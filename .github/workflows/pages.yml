name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, codex/confusion-c0-baseline-20260809]
    paths:
      - "web/**"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Server address lives in repository variables, never in source.
      - run: python scripts/build_pages.py --out _site
        env:
          LINGO_API_BASE_URL: ${{ vars.LINGO_API_BASE_URL }}
          LINGO_EDGE_ENDPOINT: ${{ vars.LINGO_EDGE_ENDPOINT }}
          LINGO_API_KEY: ${{ vars.LINGO_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
