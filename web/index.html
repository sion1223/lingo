<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="lingo-api-base-url" content="">
  <meta name="lingo-edge-endpoint" content="">
  <meta name="lingo-api-key" content="">
  <title>링고 — 한자 필기 채점</title>
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body>
  <h1>링고 — 한자 필기 튜터</h1>
  <div id="status">
    <span class="dot" id="dot" aria-hidden="true"></span><span id="stxt">서버 확인 중…</span>
    <span id="stage-badge"></span>
  </div>

  <div class="bar">
    <input id="chr" value="永" maxlength="1" aria-label="연습할 문자">
    <button id="pick" type="button">문자 선택</button>
    <button id="load" type="button">가이드</button>
    <button id="hint" type="button" hidden>한 획 보기</button>
    <button id="undo" type="button">한 획 지우기</button>
    <button id="clear" type="button">전체 지우기</button>
    <button id="go" type="button">채점하기</button>
  </div>
  <div class="bar" aria-label="빠른 문자 선택">
    <button class="quick" type="button">永</button>
    <button class="quick" type="button">水</button>
    <button class="quick" type="button">木</button>
    <button class="quick" type="button">日</button>
    <button class="quick" type="button">語</button>
  </div>

  <div id="wrap">
    <canvas id="cv" aria-label="한자 필기 영역"></canvas>
    <canvas id="coach-cv" aria-hidden="true"></canvas>
    <div id="busy-overlay" aria-live="polite">채점 중…</div>
  </div>

  <div id="coach-feedback" data-tone="success" role="status" aria-live="polite">
    <span id="coach-icon" aria-hidden="true">○</span>
    <span id="coach-text">가이드를 준비하고 있습니다.</span>
  </div>
  <div id="result"></div>

  <div id="picker" role="dialog" aria-modal="true" aria-label="문자 선택">
    <div id="picker-box">
      <div id="picker-top">
        <input id="picker-search" placeholder="문자 붙여넣기·입력하면 바로 선택" maxlength="4">
        <button id="picker-close" type="button">닫기</button>
      </div>
      <div id="picker-grid"></div>
      <div id="picker-info"></div>
    </div>
  </div>

  <script type="module" src="/web/app.js"></script>
</body>
</html>
